name: Repo checks

on:
  workflow_dispatch: {}

jobs:
  repo-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repo checks
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "Running repo_checks.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\repo_checks.ps1"
          Write-Host "Running scripts/check_git.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\check_git.ps1"
          # If gitleaks binary is present on the runner, run it
          if (Test-Path "$env:GITHUB_WORKSPACE\tools\gitleaks.exe") {
            Write-Host "Running gitleaks on workflow runner"
            & "$env:GITHUB_WORKSPACE\tools\gitleaks.exe" detect --source "$env:GITHUB_WORKSPACE" --report-path "$env:GITHUB_WORKSPACE\gitleaks-report.json" || true
          } else {
            Write-Host "gitleaks not present on runner, skipping"
          }
      - name: Upload gitleaks report if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: |
            gitleaks-staged-report.json
            gitleaks-report.json
